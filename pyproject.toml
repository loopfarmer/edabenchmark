[project]
name = "edabench"
version = "0.1.0"
description = "edabenchmark: placement-fix, agent and decision tasks over edaloop that separate models"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "edaagent"]

[tool.uv.sources]
edaagent = { path = "../edaagent", editable = true }

[project.scripts]
edabench = "edabench.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edabench"]
